[package]
name = "kroki_deskapp"
version = "3.30.0"
description = "Markdown viewer with Kroki diagram rendering"
repository = "https://github.com/vdidon/kroki-deskapp"
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Packing of the embedded latex-doc plugin into a .kdext (build.rs): Deflate
# writing only.
serde_json = "1.0.150"
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dependencies]
base64 = "0.22.1"
dunce = "1.0.5"
flate2 = "1.1.9"
notify = "8.2.0"
pikchr = "0.1.4"
reqwest = "0.13.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
svgbob = "0.7.6"
# System UI language (the "Language" (« Langue ») setting on automatic, i18n.rs).
sys-locale = "0.3"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tiny_http = "0.12.0"
# Extraction of .kdext plugin archives. All the usual zip compression methods
# are accepted (7-Zip, Compress-Archive…): Store, Deflate, Deflate64, BZip2,
# LZMA, Zstandard. Only PPMd is deliberately left out (marginal use) — the
# install reports it cleanly. `deflate-flate2-zlib-rs` rather than the `deflate`
# meta-feature: we only decompress, so there is no point embedding zopfli.
# zip >= 8 required: the lzma-rs of the 2.x versions fails on LZMA entries
# produced by 7-Zip (since replaced by lzma-rust2).
zip = { version = "8", default-features = false, features = [
    "deflate-flate2-zlib-rs",
    "deflate64",
    "bzip2",
    "lzma",
    "zstd",
] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# Direct dependency required by the `#[implement(IDropTarget)]` macro: its
# generated code references the `windows_core` crate. Version aligned with
# `windows` 0.62 to avoid a conflict with the windows-core 0.61 pulled in by
# tauri/wry.
windows-core = "0.62.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
panic = "abort"
