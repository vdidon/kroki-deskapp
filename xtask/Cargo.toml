[package]
name = "xtask"
version = "0.0.0"
edition = "2021"
publish = false
description = "Repository build tasks (see the .cargo/config.toml aliases) — not a dependency of the app"

[dependencies]
# Reading the manifest.json files inside the .kdext archives of dist/ and
# generating the .deb overlay (see src/bundled.rs). Same crates as src-tauri,
# already in the cache.
serde_json = "1"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# Multilingual MSI (src/msi_lang.rs): msi.dll, to embed the language
# transforms. Same version as src-tauri.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_System_ApplicationInstallationAndServicing",
] }
