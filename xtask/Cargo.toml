[package]
name = "xtask"
version = "0.0.0"
edition = "2021"
publish = false
description = "Tâches de build du dépôt (cf. alias .cargo/config.toml) — pas une dépendance de l'app"

[dependencies]
# Lecture des manifest.json dans les .kdext de dist/ et génération de l'overlay
# .deb (cf. src/bundled.rs). Mêmes crates que src-tauri, déjà dans le cache.
serde_json = "1"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# MSI multilingue (src/msi_lang.rs) : msi.dll, pour embarquer les transforms de
# langue. Même version que src-tauri.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_System_ApplicationInstallationAndServicing",
] }
