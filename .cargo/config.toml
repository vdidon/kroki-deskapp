# Cargo aliases to drive the `src-tauri/` crate from the repository root, without
# `cd src-tauri`. The manifest is targeted via --manifest-path: the crate stays a
# standalone package (its [profile.release] and its target/ folder unchanged).
#
#   cargo run-app         → launches the app in debug (development)
#   cargo build-app       → release build + publication into dist/ (via xtask/)
#   cargo build-appimage  → Linux AppImage (auto-installs tauri-cli if missing, via xtask/)
#   cargo build-msi       → Windows MSI installer (WiX v3, same tauri-cli, via xtask/)
#   cargo build-deb       → Debian/Ubuntu package (Linux only, same tauri-cli, via xtask/)
#   cargo lint-app        → clippy
#   cargo fmt-app         → rustfmt
#
# One alias = a single subcommand (no `clippy && fmt`), hence separate lint/fmt.
# Extra arguments are forwarded (e.g. `cargo run-app -- --flag`).
# build-app and build-appimage go through the xtask/ crate: after the build,
# the artifact is published into dist/ under a version-suffixed name
# (e.g. kroki_deskapp-1.2.3.exe) paired with an unversioned file (hardlink,
# copy as a fallback — see xtask/src/main.rs). build-appimage also bootstraps
# tauri-cli locally (xtask/target/tools/, one-shot) if it is neither there nor
# on the PATH, then runs `tauri build --config src-tauri/tauri.<target>.conf.json` —
# the overlay enables bundling without touching tauri.conf.json (see CLAUDE.md
# §§ "Linux builds" and "Windows installer (MSI)"). build-msi and build-deb
# require the plugin archives shipped in dist/ — they embed them
# (python build_dist.py --plugins-only).
[alias]
run-app = "run --manifest-path src-tauri/Cargo.toml"
build-app = "run --quiet --manifest-path xtask/Cargo.toml -- build"
build-appimage = "run --quiet --manifest-path xtask/Cargo.toml -- appimage"
build-msi = "run --quiet --manifest-path xtask/Cargo.toml -- msi"
build-deb = "run --quiet --manifest-path xtask/Cargo.toml -- deb"
lint-app = "clippy --manifest-path src-tauri/Cargo.toml"
fmt-app = "fmt --manifest-path src-tauri/Cargo.toml"
